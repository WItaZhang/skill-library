name: Production checks and image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: skill_library
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: skill_library_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skill_library -d skill_library_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://skill_library:ci-only-password@127.0.0.1:5432/skill_library_test
      DRILL_ADMIN_URL: postgresql://skill_library:ci-only-password@127.0.0.1:5432/skill_library_test
      DRILL_REPORT: docs/deployment/evidence/ci-backup-drill.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: PostgreSQL 17 clients from the service image (not an older runner pg_dump)
        run: |
          mkdir -p /tmp/pg-tools
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm --network host -v "$PWD:$PWD" -v /tmp:/tmp -w "$PWD" -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGCONNECT_TIMEOUT postgres:17-bookworm %s "$@"\n' "$tool" > "/tmp/pg-tools/$tool"
            chmod +x "/tmp/pg-tools/$tool"
          done
          echo 'PG_BIN=/tmp/pg-tools' >> "$GITHUB_ENV"
      - name: Install module lockfiles and Chromium
        run: |
          sh src/deployment/install.sh
          src/modules/product/node_modules/.bin/playwright install --with-deps chromium
          CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "./src/modules/product/node_modules/@playwright/test/index.mjs"; console.log(chromium.executablePath())')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Typecheck, unit, real PG, real browser, full restore drill
        run: sh src/integration/verify-release.sh
      - name: Build non-root production image
        run: docker build -f src/deployment/Dockerfile --build-arg RELEASE_SHA=${{ github.sha }} -t skill-library:${{ github.sha }} .
      - name: Run image and verify database survives replacement
        run: sh src/deployment/smoke-container.sh skill-library:${{ github.sha }}
      - name: Validate proxy and monitoring configuration
        run: |
          docker run --rm -e APP_DOMAIN=skills.example.test -v "$PWD/src/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --entrypoint promtool -v "$PWD/src/deployment/monitoring:/etc/prometheus:ro" prom/prometheus:v3.13.5 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus -v "$PWD/src/deployment/monitoring:/etc/prometheus:ro" prom/prometheus:v3.13.5 test rules alerts.test.yml
      - name: Keep local acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence
          if-no-files-found: error
          path: |
            docs/deployment/evidence/ci-backup-drill.json
            src/modules/product/test-results/
            src/modules/collaboration/test-results/
